<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>סרטון תדמית | CUT productions</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" />
  <style>
    :root { --ink: #1f1f1b; --teal: #17a398; --teal-d: #0e7f76; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0f1110; color: #fff; font-family: 'Heebo', Arial, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
    .frame { position: relative; height: min(82vh, calc((100vw - 32px) * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #000; cursor: pointer; }
    canvas { width: 100%; height: 100%; display: block; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.15); }
    .bar span { display: block; height: 100%; width: 0; background: var(--teal); margin-inline-start: auto; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    button, a.back { font: 500 15px 'Heebo', Arial, sans-serif; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; padding: 10px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; }
    button.main { background: var(--teal-d); border-color: var(--teal-d); }
    button:disabled { opacity: 0.5; cursor: wait; }
    .note { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; max-width: 520px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="frame" id="frame"><canvas id="c"></canvas><div class="bar"><span id="bar"></span></div></div>
  <div class="controls">
    <button id="play" class="main" type="button">▶ ניגון עם סאונד</button>
    <button id="rec" type="button">הורדת הסרטון (1080×1920)</button>
    <a class="back" href="./">חזרה לאתר</a>
  </div>
  <div class="note" id="note"></div>

  <script src="media.js"></script>
  <script src="promo.js"></script>
  <script>
  (function () {
    var promo = CutPromo.create(document.getElementById('c'), { scale: 1, muted: false, loop: false, onEnd: function () { if (window.__recStop) window.__recStop(); sync(); } });
    var bar = document.getElementById('bar'), note = document.getElementById('note');
    var playBtn = document.getElementById('play'), recBtn = document.getElementById('rec');
    promo.onFrame(function (t) { bar.style.width = (t / promo.duration * 100) + '%'; });
    function sync() { playBtn.textContent = promo.isPlaying() ? '❚❚ עצירה' : '▶ ניגון עם סאונד'; }
    function toggle() { promo.isPlaying() ? promo.pause() : promo.play(); sync(); }
    playBtn.addEventListener('click', toggle);
    document.getElementById('frame').addEventListener('click', toggle);

    // Records the canvas plus the music in real time (30 seconds) and downloads the file.
    recBtn.addEventListener('click', function () {
      if (!window.MediaRecorder || !promo.canvas.captureStream) { note.textContent = 'הדפדפן הזה לא תומך בהקלטה. נסו בכרום במחשב.'; return; }
      recBtn.disabled = playBtn.disabled = true;
      note.textContent = 'טוען חומרים…';
      promo.pause(); promo.seek(0);
      promo.ready.then(function () { return promo.renderAt(0); }).then(function () {
        var stream = promo.canvas.captureStream(30);
        try {
          var ac = new (window.AudioContext || window.webkitAudioContext)();
          var src = ac.createMediaElementSource(promo.music), dest = ac.createMediaStreamDestination();
          src.connect(dest); src.connect(ac.destination);
          dest.stream.getAudioTracks().forEach(function (tr) { stream.addTrack(tr); });
        } catch (e) {}
        var types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
        var type = types.filter(function (x) { return MediaRecorder.isTypeSupported(x); })[0] || '';
        var rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 14000000 });
        var chunks = [];
        rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          var blob = new Blob(chunks, { type: type || 'video/webm' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'CUT-productions-promo.' + (/mp4/.test(type) ? 'mp4' : 'webm');
          document.body.appendChild(a); a.click(); a.remove();
          note.textContent = /mp4/.test(type) ? 'הקובץ ירד.' : 'הקובץ ירד בפורמט WebM. אינסטגרם מקבל גם אותו, ואפשר להמיר ל-MP4 בכל ממיר.';
          recBtn.disabled = playBtn.disabled = false; sync();
        };
        note.textContent = 'מקליט… נשארו 30 שניות. לא לעבור לכרטיסייה אחרת.';
        var left = 30, iv = setInterval(function () { left--; if (left > 0) note.textContent = 'מקליט… נשארו ' + left + ' שניות. לא לעבור לכרטיסייה אחרת.'; else clearInterval(iv); }, 1000);
        rec.start(500);
        promo.seek(0); promo.play(); sync();
        window.__recStop = function () { window.__recStop = null; setTimeout(function () { rec.stop(); }, 150); };
      });
    });
  })();
  </script>
</body>
</html>
